<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>밴드 악기 소리 테스트</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #06070f; color: #e9ecf5; font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  p.lead { color: #9aa0b5; margin: 0 0 24px; line-height: 1.6; }
  section { margin-bottom: 22px; }
  h2 { font-size: 15px; color: #5ee7ff; margin: 0 0 10px; letter-spacing: 1px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  button { background: rgba(255,255,255,0.06); color: #fff; border: 1px solid rgba(255,255,255,0.16); border-radius: 10px; padding: 10px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  button:hover { background: rgba(255,255,255,0.12); }
  button:active { transform: translateY(1px); }
  .stop { border-color: #ff4d6d; color: #ff8fa3; }
  small { color: #6f7590; }
  #status { color: #c9a227; font-size: 13px; min-height: 18px; margin: 0 0 18px; }
</style>
</head>
<body>
<main>
  <h1>밴드 악기 소리 테스트</h1>
  <p class="lead">새로 넣은 실제 녹음 샘플(기타·베이스·드럼)을 들어보는 페이지예요.<br>
  <small>출처: 기타 FreePats FSBS (CC0) · 베이스 Karoryfer Black And Blue Basses (CC0) · 드럼 MuldjordKit by Lars Muldjord, DrumGizmo.org (CC BY 4.0)</small></p>
  <p id="status"></p>

  <section>
    <h2>클린 기타</h2>
    <div class="row">
      <button data-demo="cleanSweep">전체 음 (낮은 음→높은 음)</button>
      <button data-demo="cleanArp">아르페지오 (Am F C G)</button>
      <button data-demo="cleanStrum">코드 스트럼</button>
    </div>
  </section>
  <section>
    <h2>디스토션 기타</h2>
    <div class="row">
      <button data-demo="distSweep">전체 음</button>
      <button data-demo="distRiff">파워코드 리프</button>
    </div>
  </section>
  <section>
    <h2>베이스</h2>
    <div class="row">
      <button data-demo="bassSweep">전체 음</button>
      <button data-demo="bassGroove">그루브</button>
    </div>
  </section>
  <section>
    <h2>드럼</h2>
    <div class="row">
      <button data-demo="drumsEach">하나씩 (킥 스네어 하이햇 탐 심벌)</button>
      <button data-demo="drumsBeat">록 비트</button>
      <button data-demo="drumsFill">탐 필인 + 크래시</button>
      <button data-demo="hhChoke">하이햇 열림 → 닫힘</button>
    </div>
  </section>
  <section>
    <h2>합주</h2>
    <div class="row">
      <button data-demo="bandRock">록 (드럼 + 베이스 + 디스토션)</button>
      <button data-demo="bandClean">클린 (드럼 + 베이스 + 클린 기타)</button>
      <button class="stop" data-demo="stop">정지</button>
    </div>
  </section>
</main>

<script src="js/music.js"></script>
<script src="js/sampler.js"></script>
<script>
// 게임 코드(music.js)의 이름과 겹치지 않도록 함수 안에 둠
(() => {
'use strict';
const B = 60 / 120 / 4; // 120BPM 16분음표 길이(초)
const smp = (inst, o) => Object.assign({ type: 'smp', inst }, o);
const note = (inst, m, len, o = {}) => smp(inst, Object.assign({ midi: m, dur: len * B }, o));
const drum = (key, o = {}) => smp('drums', Object.assign({ key }, o));
// 기타 줄을 위에서 아래로 긁듯이 조금씩 늦게 (16분음표의 0.12칸 ≈ 15ms)
const strum = (s, inst, notes, len, o = {}) => notes.map((m, i) => [s + i * 0.12, note(inst, m, len, Object.assign({ vel: 0.75 }, o))]);

const CHORDS = { Am: [45, 52, 57, 60, 64], F: [41, 48, 53, 57, 60], C: [48, 52, 55, 60, 64], G: [43, 47, 50, 55, 59] };
const ARP = { Am: [45, 52, 57, 60, 64, 60, 57, 52], F: [41, 48, 53, 57, 60, 57, 53, 48], C: [48, 52, 55, 60, 64, 60, 55, 52], G: [43, 50, 55, 59, 62, 59, 55, 50] };
const ROOT = { Am: 33, F: 29, C: 36, G: 31 };
const PROG = ['Am', 'F', 'C', 'G'];
const power = r => [r, r + 7, r + 12];

// 한 마디(16칸) 록 비트: 킥 0·6·8, 스네어 4·12, 하이햇 8분음표
function beat(bar, { open = false, crash = false } = {}) {
  const s = bar * 16, ev = [];
  for (const k of [0, 6, 8, 10]) if (k !== 10 || bar % 2) ev.push([s + k, drum('kick', { vel: k === 0 ? 1 : 0.85 })]);
  for (const k of [4, 12]) ev.push([s + k, drum('snare')]);
  for (let k = 0; k < 16; k += 2) {
    if (open && k === 14) ev.push([s + k, drum('hho', { vel: 0.8 })]);
    else ev.push([s + k, drum('hhc', { vel: k % 4 ? 0.6 : 0.85 })]);
  }
  if (crash) ev.push([s, drum('crash', { vel: 0.8 })]);
  return ev;
}

const DEMOS = {
  cleanSweep: [36, 40, 45, 48, 52, 55, 59, 61, 64, 67, 71, 74, 77, 80, 85].map((m, i) => [i * 4, note('gtr_clean', m, 4)]),
  cleanArp: PROG.flatMap((c, b) => ARP[c].map((m, i) => [b * 16 + i * 2, note('gtr_clean', m, 6, { vel: 0.7 })])),
  cleanStrum: PROG.flatMap((c, b) => [...strum(b * 16, 'gtr_clean', CHORDS[c], 7), ...strum(b * 16 + 8, 'gtr_clean', CHORDS[c], 6, { vel: 0.6 })]),
  distSweep: [36, 40, 45, 48, 52, 55, 59, 61, 64, 67, 71, 74, 77].map((m, i) => [i * 4, note('gtr_dist', m, 4)]),
  distRiff: [
    ...[0, 2, 4, 6].map(s => [s, smp('gtr_dist', { notes: power(40), dur: B * 1, rel: 0.05, vel: 0.9 })]),
    [8, smp('gtr_dist', { notes: power(43), dur: B * 4 })], [12, smp('gtr_dist', { notes: power(45), dur: B * 4 })],
    ...[16, 18, 20, 22].map(s => [s, smp('gtr_dist', { notes: power(40), dur: B * 1, rel: 0.05, vel: 0.9 })]),
    [24, smp('gtr_dist', { notes: power(48), dur: B * 4 })], [28, smp('gtr_dist', { notes: power(47), dur: B * 8 })],
  ],
  bassSweep: [23, 26, 29, 32, 35, 38, 41, 44, 47, 50, 53, 56].map((m, i) => [i * 4, note('bass', m, 4)]),
  bassGroove: PROG.flatMap((c, b) => [0, 2, 4, 6, 8, 10, 12, 14].map(k => [b * 16 + k, note('bass', ROOT[c] + (k === 10 ? 12 : 0), 1.8, { vel: k % 4 ? 0.75 : 1 })])),
  drumsEach: ['kick', 'snare', 'snare_soft', 'hhc', 'hhc_soft', 'hho', 'tom1', 'tom2', 'tom3', 'tom4', 'ride', 'ride_bell', 'crash', 'crash2', 'china']
    .map((k, i) => [i * 6, drum(k)]),
  drumsBeat: [...beat(0, { crash: true }), ...beat(1, { open: true }), ...beat(2), ...beat(3, { open: true })],
  drumsFill: [
    ...beat(0, { crash: true }).filter(([s]) => s < 8),
    ...['tom1', 'tom1', 'tom2', 'tom2', 'tom3', 'tom3', 'tom4', 'tom4'].map((k, i) => [8 + i, drum(k, { vel: 0.8 + (i % 2) * 0.15 })]),
    [16, drum('kick')], [16, drum('crash')],
  ],
  hhChoke: [[0, drum('hho')], [4, drum('hhc')], [8, drum('hho')], [10, drum('hhc')], [12, drum('hho')], [16, drum('hhc')]],
  bandRock: [
    ...[0, 1, 2, 3].flatMap(b => beat(b, { crash: b === 0, open: b === 3 })),
    ...PROG.flatMap((c, b) => [0, 2, 4, 6, 8, 10, 12, 14].map(k => [b * 16 + k, note('bass', ROOT[c], 1.8, { vel: 0.9 })])),
    ...PROG.flatMap((c, b) => [
      ...[0, 2, 4, 6].map(k => [b * 16 + k, smp('gtr_dist', { notes: power(ROOT[c] + 12), dur: B, rel: 0.05, vel: 0.85 })]),
      [b * 16 + 8, smp('gtr_dist', { notes: power(ROOT[c] + 12), dur: B * 7 })],
    ]),
  ],
  bandClean: [
    ...[0, 1, 2, 3].flatMap(b => beat(b, { crash: b === 0 }).map(([s, e]) => [s, Object.assign(e, { vel: (e.vel ?? 1) * 0.75 })])),
    ...PROG.flatMap((c, b) => [0, 6, 8, 12].map(k => [b * 16 + k, note('bass', ROOT[c], k === 8 ? 3.5 : 2, { vel: 0.9 })])),
    ...PROG.flatMap((c, b) => ARP[c].map((m, i) => [b * 16 + i * 2, note('gtr_clean', m + 12, 4, { vel: 0.6 })])),
  ],
};

let bus = null;
const status = document.getElementById('status');
const ready = Samples.load(['guitar', 'bass', 'drums']).then(() => { status.textContent = ''; });
status.textContent = '샘플 불러오는 중…';

function stop() {
  if (bus) Sound.closeBus(bus);
  bus = null;
}
async function play(name) {
  const ctx = Sound.init();
  await ready;
  stop();
  bus = Sound.createBus(B * 3, { time: 1.6, wet: 0.12 });
  const t0 = ctx.currentTime + 0.08;
  for (const [s, ev] of DEMOS[name]) playEvent(bus, t0 + s * B, ev);
}
document.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.demo === 'stop') stop();
  else play(b.dataset.demo);
}));
window.bandTest = { ready, DEMOS, play };
})();
</script>
</body>
</html>
